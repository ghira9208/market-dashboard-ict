 * the month name used to repeat on every tick instead of just once.
 * fullTimeFormat (full "Mon D, HH:MM") is kept for the crosshair readout,
 * which always wants complete context, not a tier-appropriate fragment.
 * ------------------------------------------------------------------- */
const MONTH_NAMES = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fullTimeFormat(sec) {
  const d = new Date(sec * 1000);
  const hh = String(d.getUTCHours()).padStart(2, '0'), mm = String(d.getUTCMinutes()).padStart(2, '0');
  return `${MONTH_NAMES[d.getUTCMonth()]} ${d.getUTCDate()}, ${hh}:${mm}`;
}
function axisTickFormat(sec, tickMarkType) {
  const d = new Date(sec * 1000);
  switch (tickMarkType) {
    case LC.TickMarkType.Year:
      return String(d.getUTCFullYear());
    case LC.TickMarkType.Month:
      return MONTH_NAMES[d.getUTCMonth()];
    case LC.TickMarkType.DayOfMonth:
      return String(d.getUTCDate());
    default: {
      const hh = String(d.getUTCHours()).padStart(2, '0'), mm = String(d.getUTCMinutes()).padStart(2, '0');
      return `${hh}:${mm}`;
    }
  }
}
let tickLabels = {};
chart.applyOptions({
  timeScale: {
    tickMarkFormatter: (time, tickMarkType) => tickLabels[String(time)] || axisTickFormat(time, tickMarkType),
  },
  localization: { timeFormatter: (time) => tickLabels[String(time)] || fullTimeFormat(time) },
});

/* ---------------------------------------------------------------------
 * Incremental vs. full update decision.
 *
 * Python already knows, at the moment it builds each call, whether this
 * is a genuinely new dataset (ticker/timeframe/session/log-scale changed)
 * or just a live price tick on the SAME dataset — that's cheap for it to
 * track and expensive to re-derive here by diffing arrays. So Python
 * sends an explicit `fingerprint` string that only changes on a real
 * dataset change; matching it against the last-seen one is all this needs.
 * ------------------------------------------------------------------- */
let lastFingerprint = null;
// Set true right after this frontend instance's very first full reload
// actually lands real data. Exists purely so the time-range-preservation
// logic in handleRender can tell "a real user view from an earlier render"
// apart from "this chart's own pre-data default state" — confirmed
// directly that the difference matters: chart.timeScale().getVisibleRange()
// on a brand-new chart returns null immediately after createChart(), but
// NOT necessarily by the time the first real render actually reaches the
// full-reload branch — once the ResizeObserver has fired at least once
// (giving the container a real width), an untouched empty time scale can
// already report a non-null "current wall-clock time" range with no
// relation to any dataset. That range would otherwise pass the "does the
// saved range overlap the new data" check purely by coincidence (a
// same-day dataset trivially overlaps "now") and get restored as if it
// were a real prior view — landing on a near-empty, one-bar-wide window
// instead of the intended "first ever load, fit everything" behavior.
let hasRenderedOnce = false;
// The dataset actually sitting in candleSeries as of the last full reload —
// kept purely so the NEXT full reload can convert "what logical range is
// currently visible" into real calendar times itself, instead of asking
// the chart for them. Confirmed directly as a genuine lightweight-charts
// quirk, not a hypothetical: after this module's own setVisibleLogicalRange
// call (see the restore path below) lands a chart on the exact right
// window — getVisibleLogicalRange() immediately reads back the correct
// indices, and the screen shows the correct bars — timeScale().
// getVisibleRange() (the TIME-based read) still reports a stale, unrelated
// timestamp pair for that same window, seemingly left over from whatever
// internal index-to-time mapping it last computed. Since the very next
// switch's "what was the user looking at" capture used exactly that call,
// it inherited the stale times and landed on a completely wrong calendar
// window one hop later — reproduced repeatedly, always the same way.
// getVisibleLogicalRange() never showed this staleness, so reading the
// logical range and mapping it to real times ourselves — via
// candleSeries.data(), queried fresh at the moment it's needed rather
// than snapshotted into a variable of our own — sidesteps the bug
// instead of working around one specific symptom of it. A snapshot taken
// only on full reloads (candleBars, right after setData()) was tried
// first and confirmed wrong: safeSeriesUpdate's ordinary incremental
// ticks (a new candle opening between one full reload and the next) can
// append bars to the real series that a once-per-full-reload snapshot
// never sees, so its own length silently falls behind the live series'
// — exactly the gap that made a genuinely-current visible range look
// "out of bounds" against it and reproduced the reported "ends up zoomed
// in after a few switches" a few hops later.
let activeRectangles = [];
let activeHLines = [];
let activeGhostCandles = [];
let activeVolumeProfile = null;
let activeFootprint = null;
// Measure-tool state — deliberately separate from the arrays above:
// clearOverlays() runs on every data re-render (new bars, ticker switch),
// and a user's own measurements should survive that, not vanish the next
// time a live tick comes in. Only the explicit "Measure" toggle-off or a
// right-click on the chart touches these.
let measureMode = false;
let measureA = null;       // {time, price} once the first click of a pair has landed, else null
let measurePrimitives = []; // completed AND in-progress MeasurePrimitive instances

// Backing state for the crosshair-hover OHLC readout below: the latest
// render's bars (keyed by time for O(1) lookup) and its ticker/source meta,
// kept around so the crosshairMove subscription — set up once, outside
// handleRender — always has the current dataset to read from.
let barsByTime = new Map();
let currentOhlcMeta = {};
let lastBar = null;

// Two independent sources now push into the same "current bar" slot —
// Python's own poll-driven fragment (every 1-8s) and, for crypto, the
// Binance WS feed below (sub-second). lightweight-charts' series.update()
// requires non-decreasing time and throws ("Cannot update oldest data")
// if a call arrives with a time behind what's already applied — which
// happens for real the moment WS has already advanced to a new bar and
// the slower poll then reports the previous one. Routing every update
// through here — reset on each full reload, checked before every partial
// one — makes whichever source is actually ahead win and silently drops
// the stale one, instead of either source being able to crash the chart.
let lastSeriesTime = null;
function safeSeriesUpdate(bar, volBar) {
  if (lastSeriesTime !== null && bar.time < lastSeriesTime) return;
  candleSeries.update(bar);
  if (volBar) volumeSeries.update(volBar);
  lastSeriesTime = bar.time;
}

/* ---------------------------------------------------------------------
 * Live tick feed — Binance's public kline WebSocket, connected to
 * DIRECTLY from the browser. This is the actual mechanism behind "how
 * does TradingView update so fast": a push feed reacts the instant a
 * trade happens on its own persistent connection, instead of the client
 * periodically asking "anything new?" the way every other data path in
 * this app (Python's own poll-driven fragments) has to. Binance is the
 * one provider in this app's chain that exposes a free public WS feed —
 * crypto tickers (…-USD) only, everything else keeps riding the
 * poll-based path Python already drives.
 *
 * Deliberately layered ON TOP of, not instead of, the existing
 * poll-driven updates: Python's own fetch still owns full reloads
 * (ticker/TF switches, historical bars) and keeps correcting the last
 * bar every 1-8s regardless — if the WS drops or Binance is unreachable,
 * nothing breaks, the chart just falls back to exactly the cadence it
 * already had.
 * ------------------------------------------------------------------- */
// Same trick as Python's own _ny_fake_utc_seconds (see app.py) — the WS
// feed's timestamps are genuine UTC (Binance), but every bar this chart
// already has came from Python re-labeling display_tz's wall-clock digits
// as if they were UTC (lightweight-charts has no timezone setting of its
// own). Skipping this on the WS path would place every live tick hours
// off the historical candles it's supposed to be updating — confirmed by
// working through exactly what _ny_fake_utc_seconds does before writing
// this, not by trial and error against a visibly-wrong chart.
//
// displayTz/DISPLAY_FMT are mutable (not a single module-level const the
// way this started, back when the whole app only ever showed NY time) —
// theme.render_timezone_selector() lets the user change which zone every
// chart displays, and handleRender's own args.display_tz below rebuilds
// this Intl formatter whenever that selection actually changes, so the
// live-tick path always matches whatever zone the historical bars this
// same render already carry were encoded in.
let displayTz = 'America/New_York';
let DISPLAY_FMT = buildDisplayFmt(displayTz);
function buildDisplayFmt(tz) {
  return new Intl.DateTimeFormat('en-US', {
    timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false,
  });
}
function setDisplayTz(tz) {
  if (tz && tz !== displayTz) {
    displayTz = tz;
    DISPLAY_FMT = buildDisplayFmt(tz);
  }
}
function nyFakeUtcSeconds(realUtcMs) {
  const parts = DISPLAY_FMT.formatToParts(new Date(realUtcMs));
  const get = (type) => parseInt(parts.find((p) => p.type === type).value, 10);
  let hour = get('hour');
  if (hour === 24) hour = 0; // some engines report midnight as "24" with hour12:false
  return Math.floor(Date.UTC(get('year'), get('month') - 1, get('day'), hour, get('minute'), get('second')) / 1000);
}

const BINANCE_WS_INTERVAL = {
  '1m': '1m', '5m': '5m', '15m': '15m', '30m': '30m',
  '1h': '1h', '4h': '4h', '1D': '1d', '1W': '1w', '1M': '1M',
};
let liveWs = null;
let liveWsKey = null; // "SYMBOL|interval" currently subscribed, or null

function closeLiveFeed() {
  if (liveWs) {
    try { liveWs.close(); } catch (e) { /* already closing/closed */ }
    liveWs = null;
  }
  liveWsKey = null;
}

function connectLiveFeed(tickerSymbol, tfInterval) {
  if (!tickerSymbol || !tickerSymbol.toUpperCase().endsWith('-USD')) { closeLiveFeed(); return; }
  const bnInterval = BINANCE_WS_INTERVAL[tfInterval];
  if (!bnInterval) { closeLiveFeed(); return; }
  const bnSymbol = tickerSymbol.toUpperCase().replace('-USD', '') + 'USDT'; // BTC-USD -> BTCUSDT
  const key = bnSymbol + '|' + bnInterval;
  if (key === liveWsKey) return; // already on exactly this stream — most renders land here
  closeLiveFeed();
  liveWsKey = key;
  const ws = new WebSocket(`wss://stream.binance.com:9443/ws/${bnSymbol.toLowerCase()}@kline_${bnInterval}`);
  liveWs = ws;
  ws.onmessage = (event) => {
    if (ws !== liveWs) return; // a newer connection already replaced this one — stale message, drop it
    let msg;
    try { msg = JSON.parse(event.data); } catch (e) { return; }
    const k = msg && msg.k;
    if (!k) return;
    const bar = {
      time: nyFakeUtcSeconds(k.t),
      open: parseFloat(k.o), high: parseFloat(k.h), low: parseFloat(k.l), close: parseFloat(k.c),
    };
    const volume = parseFloat(k.v) || 0;
    safeSeriesUpdate(bar, {
      time: bar.time, value: volume,
      color: bar.close >= bar.open ? 'rgba(48,209,88,0.5)' : 'rgba(255,69,58,0.5)',
    });
    const fullBar = Object.assign({ volume }, bar);
    barsByTime.set(bar.time, fullBar);
    lastBar = fullBar;
    // Keeps the "closes in" countdown's bar boundary pinned to Binance's own
    // kline clock instead of Python's — Yahoo's polled forming-bar data (the
    // only other source of forming_bar_time) can lag true wall-clock time by
    // tens of seconds, which left the countdown stuck at 0:00 across a bar
    // rollover until Python's next poll happened to catch up (confirmed live
    // on BTC-USD/1m before adding this). bar_seconds itself is left alone —
    // it's the fixed TF duration Python already sends and Binance's interval
    // string maps to the exact same duration, nothing to resync there.
    formingBarTime = bar.time;
    renderOhlc(lastBar, false);
  };
  // No reconnect-on-error loop — a dropped WS just means this chart quietly
  // falls back to Python's own poll cadence until the next full render
  // calls connectLiveFeed() again (e.g. the active-panel's 1s tick), which
  // opens a fresh connection on its own.
  ws.onerror = () => {};
}

function renderOhlc(bar, hovering) {
  if (!bar) return;
  const up = bar.close >= bar.open;
  const color = up ? '#30D158' : '#FF453A';
  const ohlc = currentOhlcMeta;
  // Hovering a historical candle shows that candle's real close, which
  // isn't "the price" the way the live last bar's close is — dim the C
  // label so it can't be mistaken for a live tick, and swap the source
  // caption to say what's actually being shown.
  document.getElementById('ohlcOverlay').innerHTML =
    `<span class="sym" style="color:${color}">${ohlc.ticker || ''}</span>` +
    `<span class="lbl"> &nbsp;O</span> <span class="val">${bar.open.toFixed(currentPriceDecimals)}</span>` +
    `<span class="lbl"> &nbsp;H</span> <span class="val">${bar.high.toFixed(currentPriceDecimals)}</span>` +
    `<span class="lbl"> &nbsp;L</span> <span class="val">${bar.low.toFixed(currentPriceDecimals)}</span>` +
    `<span class="lbl"> &nbsp;C</span> <span class="val" style="color:${hovering ? '#98989d' : color}">${bar.close.toFixed(currentPriceDecimals)}</span>` +
    (hovering ? `<span class="src"> &nbsp;·&nbsp; hover</span>`
               : (ohlc.source ? `<span class="src"> &nbsp;·&nbsp; ${ohlc.source}</span>` : ''));
  renderCountdown();
}

// Ticks the "closes in" readout for the live forming bar. Independent of
// renderOhlc's own rebuilds (called there too, so it's never stale after a
// real update) because it also needs to advance once a second on its own —
// Python's poll cadence is 10-120s (1s only for the selected panel), far
// too coarse for a per-second countdown by itself. bar_seconds comes from
// app.py (only set for the native intraday TFs that track a forming bar at
// all — see forming_bar_ts in app.py); no bar_seconds or no formingBarTime
// means there's nothing currently forming to count down, so it stays blank
// rather than showing a stale or meaningless value.
function renderCountdown() {
  const el = document.getElementById('countdownOverlay');
  const barSeconds = currentOhlcMeta.bar_seconds;
  if (formingBarTime === null || !barSeconds) { el.textContent = ''; return; }
  const nowAxis = nyFakeUtcSeconds(Date.now());
  const remaining = Math.max(0, (formingBarTime + barSeconds) - nowAxis);
  const mm = Math.floor(remaining / 60);
  const ss = remaining % 60;
  el.innerHTML = `closes in <span class="cdval">${mm}:${String(ss).padStart(2, '0')}</span>`;
}
setInterval(renderCountdown, 1000);

// TradingView's own documented pattern (subscribeCrosshairMove) — swap the
// corner readout to whatever candle the crosshair is over, falling back to
// the latest bar the instant the mouse leaves the chart. This is the one
// piece of the readout that's genuinely cheap to make interactive: no
// server round-trip, just a Map lookup against data already on the client.
chart.subscribeCrosshairMove((param) => {
  if (!param || param.time === undefined) {
    renderOhlc(lastBar, false);
    return;
  }
  const bar = barsByTime.get(param.time);
  renderOhlc(bar || lastBar, !!bar);
});

// A plain click (not a pan-drag) reports "this chart got picked" up to
// Streamlit as the component's return value — plus, now, WHERE it was
// clicked (time/price), so Python can hit-test it against known zones
// (Feature C: "click an area, scan for what's meaningful about it").
// clickId is Date.now() rather than a fixed value so Python sees a
// genuinely new value on every click, including clicking the SAME
// already-selected chart again at a different spot — a value that never
// changes would never re-fire the widget-changed check on the Python
// side. No "which panel" field needed: each ict_chart(...) call (main,
// mini HTF, mini LTF) is already its own component instance with its own
// key, so Python already knows which panel a return value came from at
// its own call site.
chart.subscribeClick((param) => {
  if (!param) return;
  const hasPoint = param.time !== undefined && !!param.point;
  const clickPrice = hasPoint ? candleSeries.coordinateToPrice(param.point.y) : null;
  if (measureMode && hasPoint && clickPrice !== null) {
    const point = { time: param.time, price: clickPrice };
    if (!measureA) {
      // First click of a pair — drop a dot marker so there's immediate
      // feedback, then wait for the second click to complete the line.
      measureA = point;
      const dot = new MeasurePrimitive(point, null, '#0A84FF', null);
      candleSeries.attachPrimitive(dot);
      measurePrimitives.push(dot);
    } else {
      const pending = measurePrimitives[measurePrimitives.length - 1];
      pending.setPoint2(point, measureLabel(measureA, point));
      measureA = null;
    }
  }
  // Still reported even while measuring — "this panel got clicked" and
  // "a measurement point got placed" aren't mutually exclusive, and the
  // panel-select behavior is harmless to keep regardless of tool mode.
  sendToStreamlit('streamlit:setComponentValue', {
    value: { clickId: Date.now(), time: hasPoint ? param.time : null, price: clickPrice },
    dataType: 'json',
  });
});

// Shared by both clear paths below: turning the tool off, and right-click.
// Detaches every completed AND in-progress measurement, leaving nothing
// on the chart — confirmed directly as a real complaint otherwise: a
// finished measurement used to persist indefinitely once the tool was
// switched off (only a still-dangling, incomplete first click got
// cleaned up), with no obvious way to remove it short of remembering
// the right-click gesture.
function clearAllMeasurements() {
  measurePrimitives.forEach((p) => candleSeries.detachPrimitive(p));
  measurePrimitives = [];
  measureA = null;
}

document.getElementById('measureBtn').addEventListener('click', () => {
  measureMode = !measureMode;
  document.getElementById('measureBtn').classList.toggle('active', measureMode);
  container.style.cursor = measureMode ? 'crosshair' : '';
  if (!measureMode) clearAllMeasurements();
});

// Right-click = clear, the standard convention for a drawing tool's own
// "start over" gesture — works any time there's actually something to
// clear (mid-measurement, or a completed one left over from before the
// tool was switched off), so it stays available as an explicit "remove
// this" even after measureMode itself has gone back to false. The
// browser's own context menu is only suppressed when there's something
// of ours to clear — otherwise this is a no-op and the normal menu still
// opens.
container.addEventListener('contextmenu', (e) => {
  if (!measureA && measurePrimitives.length === 0) return;
  e.preventDefault();
  clearAllMeasurements();
});

// Per-category "did this actually change since last render" tracking —
// see applyOverlays' own comment below for why this exists. Deliberately
// one bucket per overlay kind, not one fingerprint for the whole
// `overlays` object: a layer checkbox toggling FVG on/off changes
// `rectangles` but not `ghost_candles`, and re-touching the (potentially
// thousands of) ghost-candle primitives just because SOME unrelated
// layer changed would defeat the whole point.
let lastOverlayRaw = { rectangles: null, price_lines: null, ghost_candles: null, volume_profile: null,
                        footprint: null, markers: null };

function _overlayArrayChanged(key, value) {
  const nextValue = value || [];
  const changed = JSON.stringify(nextValue) !== JSON.stringify(lastOverlayRaw[key]);
  lastOverlayRaw[key] = nextValue;
  return changed;
}

// Overlays used to be torn down and rebuilt from scratch on EVERY render
// call — including the main chart's own once-a-second auto-refresh tick,
// whether or not anything about them had actually changed. Harmless at
// "a few dozen" primitives (this file's own prior comment's own
// assumption), but confirmed directly on a real 5m chart with several
// layers plus an active backfill tier: 4,500 ghost-candle primitives
// attached at once (see _MAX_TOTAL_TILES in app.py/crypto_app.py, capped
// at 5000) — detaching and reattaching all of those every single second,
// even though Python's own backfill cache (_main_backfill_cache) only
// actually recomputes them once every several minutes, is exactly the
// kind of redundant per-tick cost this file's own fingerprint mechanism
// (see lastFingerprint above) already exists to spare the candle series
// itself; overlays just never got the same treatment. Comparing the
// incoming arrays against what's already attached, per category, and
// only touching categories that genuinely changed, is cheap even at
// thousands of items (JSON.stringify + a string compare on a few
// thousand small flat objects runs in low-single-digit milliseconds) —
// nowhere near what the attach/detach churn itself costs.
function applyOverlays(overlays) {
  overlays = overlays || {};
  // ghost_candles/volume_profile are OMITTED entirely (not sent as an
  // empty array — a real, meaningful difference) on a plain incremental
  // tick, since Python only recomputes either one on a genuine full
  // reload. Checking key PRESENCE first, before ever touching
  // _overlayArrayChanged's own JSON.stringify compare, means an
  // incremental tick skips this pair completely instead of paying to
  // serialize/compare a ~250KB array just to conclude nothing changed —
  // whatever's already attached is already correct, so do nothing at all.
  if ('ghost_candles' in overlays && _overlayArrayChanged('ghost_candles', overlays.ghost_candles)) {
    activeGhostCandles.forEach((g) => candleSeries.detachPrimitive(g));
    activeGhostCandles = [];
    // ONE batch primitive holding every tile, not one primitive PER tile —
    // see GhostCandleBatchRenderer's own docstring for why (up to 4,500
    // separate primitives measured live pegging the renderer at 600% CPU).
    // Attached first specifically so it sits under everything else added
    // this same pass too (zOrder 'bottom' already keeps it under the real
    // candles; this ordering keeps it under FVG/OB rectangles as well).
    const tiles = overlays.ghost_candles || [];
    if (tiles.length) {
      const batch = new GhostCandleBatchPrimitive(tiles);
      candleSeries.attachPrimitive(batch);
      activeGhostCandles.push(batch);
    }
  }
  if ('volume_profile' in overlays && _overlayArrayChanged('volume_profile', overlays.volume_profile)) {
    if (activeVolumeProfile) {
      candleSeries.detachPrimitive(activeVolumeProfile);
      activeVolumeProfile = null;
    }
    if ((overlays.volume_profile || []).length) {
      activeVolumeProfile = new VolumeProfilePrimitive(overlays.volume_profile);
      candleSeries.attachPrimitive(activeVolumeProfile);
    }
  }
  // footprint is a single {tick, candles} object, not an array (see
  // _overlayArrayChanged's own "falls back to []" default — works for an
  // object too, it just always reads as "different from []" the one
  // time it's genuinely absent, which is exactly what should trigger a
  // detach). Present-but-empty candles (Python sends {tick, candles: []}
  // rather than omitting the key when the user zoomed back out) still
  // detaches cleanly through the same `.candles.length` check below.
  if ('footprint' in overlays && _overlayArrayChanged('footprint', overlays.footprint)) {
    if (activeFootprint) {
      candleSeries.detachPrimitive(activeFootprint);
      activeFootprint = null;
    }
    if (overlays.footprint && (overlays.footprint.candles || []).length) {
      activeFootprint = new FootprintPrimitive(overlays.footprint);
      candleSeries.attachPrimitive(activeFootprint);
    }
  }
  if (_overlayArrayChanged('rectangles', overlays.rectangles)) {
    activeRectangles.forEach((r) => candleSeries.detachPrimitive(r));
    activeRectangles = [];
    (overlays.rectangles || []).forEach((r) => {
      const rect = new RectanglePrimitive(
        { time: r.t0, price: r.p0 }, { time: r.t1, price: r.p1 }, r.fill, r.border || null, r.label || null,
        r.border_width || 1, r.fill_to || null, r.extend_to_edge || false, r.body_lines || null
      );
      candleSeries.attachPrimitive(rect);
      activeRectangles.push(rect);
    });
  }
  if (_overlayArrayChanged('price_lines', overlays.price_lines)) {
    activeHLines.forEach((l) => candleSeries.detachPrimitive(l));
    activeHLines = [];
    (overlays.price_lines || []).forEach((l) => {
      const hline = new HLinePrimitive(l.t0, l.t1, l.price, l.color, l.title || '', l.line_width || 1, l.dashed, l.above);
      candleSeries.attachPrimitive(hline);
      activeHLines.push(hline);
    });
  }
  if (_overlayArrayChanged('markers', overlays.markers)) {
    markersHandle.setMarkers(overlays.markers || []);
  }
}

/* ---------------------------------------------------------------------
 * Standard indicators (MA/Bollinger overlay the main pane; RSI/MACD each
 * get their own pane below it via chart.addSeries(type, options,
 * paneIndex)). Rebuilt from scratch on every render — series/pane creation
 * is cheap and only runs once per Streamlit interaction, not per frame, so
 * there's no reason to diff instead of just tearing down and redrawing
 * whatever's currently enabled. Panes always collapse back down to just
 * the main one before rebuilding, so toggling RSI/MACD off actually
 * reclaims the vertical space instead of leaving an empty pane behind.
 * ------------------------------------------------------------------- */
let indicatorSeriesMap = {};
// Same "non-decreasing time or lightweight-charts throws" guard
// candleSeries already needed (see safeSeriesUpdate/lastSeriesTime above)
// — a fresh trailing-N-point tail is recomputed every incremental tick,
// so consecutive ticks' tails overlap (the same bar can appear near the
// END of one tick's tail and near the START of the next), and naively
// replaying a whole tail in order calls .update() with an OLDER time
// than what the series already has, which throws "Cannot update oldest
// data" — confirmed directly, not hypothetical. One tracked time per
// series, keyed the same as indicatorSeriesMap.
let lastIndicatorTime = {};

function clearIndicators() {
  Object.values(indicatorSeriesMap).forEach((s) => {
    try { chart.removeSeries(s); } catch (e) { /* already gone */ }
  });
  indicatorSeriesMap = {};
  lastIndicatorTime = {};
  while (chart.panes().length > 1) {
    chart.removePane(chart.panes().length - 1);
  }
}

function safeIndicatorUpdate(key, point) {
  const s = indicatorSeriesMap[key];
  if (!s || !point) return;
  const last = lastIndicatorTime[key];
  if (last !== undefined && point.time < last) return; // stale, a faster/earlier source already advanced past this
  s.update(point);
  lastIndicatorTime[key] = point.time;
}

// Python now tells us directly whether this is a full reload
// (ind._full_reload) instead of us guessing from a content hash — a
// hash-based skip (what applyOverlays' ghost_candles/markers arrays still
// correctly use) doesn't work for indicators specifically: unlike those,
// indicator SERIES genuinely gain a new point almost every tick a bar
// forms, so a JSON.stringify comparison almost never matched anyway,
// meaning this used to do a full pane teardown + rebuild (up to 8 series,
// each carrying the WHOLE loaded window's worth of points — confirmed
// directly at over 1MB of JSON on a real 1m chart) on close to every
// single auto-refresh tick, not just genuine full reloads. Same fix as
// bars/ghost candles already got: full rebuild only when Python says the
// indicator SETTINGS (or anything else forcing a full reload) actually
// changed; otherwise `ind` carries just the last few points of each
// active series, pushed onto the EXISTING series via .update() instead of
// a full setData() teardown+rebuild.
function applyIndicators(ind) {
  ind = ind || {};
  if (ind._full_reload === false) {
    const pushTail = (key, arr) => {
      if (!arr) return;
      arr.forEach((point) => safeIndicatorUpdate(key, point));
    };
    pushTail('rsi', ind.rsi);
    pushTail('atr', ind.atr);
    if (ind.macd) {
      pushTail('macd_line', ind.macd.macd);
      pushTail('macd_signal', ind.macd.signal);
      pushTail('macd_hist', ind.macd.histogram);
    }
    pushTail('ma_fast', ind.ma_fast);
    pushTail('ma_slow', ind.ma_slow);
    if (ind.bb) {
      pushTail('bb_upper', ind.bb.upper);
      pushTail('bb_basis', ind.bb.basis);
      pushTail('bb_lower', ind.bb.lower);
    }
    return;
  }

  clearIndicators();
  let nextPane = 1;
  let numFixedPanes = 0; // RSI/MACD panes, each fixed at FIXED_PANE_PX

  // Registers a fresh full-reload series AND seeds lastIndicatorTime from
  // its own last point, so the very next INCREMENTAL tick's
  // safeIndicatorUpdate has a real baseline to compare against instead of
  // treating everything as "newer" (undefined) and silently accepting a
  // stale point right after a reload.
  const registerSeries = (key, series, dataArr) => {
    indicatorSeriesMap[key] = series;
    lastIndicatorTime[key] = (dataArr && dataArr.length) ? dataArr[dataArr.length - 1].time : undefined;
  };

  if (ind.rsi && ind.rsi.length) {
    const s = chart.addSeries(LC.LineSeries, {
      color: '#BF5AF2', lineWidth: 1, priceLineVisible: false, lastValueVisible: true,
    }, nextPane);
    s.setData(ind.rsi);
    s.createPriceLine({ price: 70, color: 'rgba(255,255,255,0.25)', lineWidth: 1, lineStyle: LC.LineStyle.Dashed, axisLabelVisible: true, title: '70' });
    s.createPriceLine({ price: 30, color: 'rgba(255,255,255,0.25)', lineWidth: 1, lineStyle: LC.LineStyle.Dashed, axisLabelVisible: true, title: '30' });
    registerSeries('rsi', s, ind.rsi);
    nextPane += 1;
    numFixedPanes += 1;
  }

  if (ind.atr && ind.atr.length) {
    // Unlike RSI (0-100, fixed bounds, worth marking 30/70) ATR has no
    // fixed range at all — it's in the instrument's own raw price units,
    // so it auto-scales to whatever this ticker/timeframe's own recent
    // range is. No reference lines make sense here the way they do for
    // RSI; the pane's own auto-scaling IS the useful read (is the line
    // climbing = volatility expanding, falling = contracting).
    const s = chart.addSeries(LC.LineSeries, {
      color: '#5E5CE6', lineWidth: 1, priceLineVisible: false, lastValueVisible: true,
    }, nextPane);
    s.setData(ind.atr);
    registerSeries('atr', s, ind.atr);
    nextPane += 1;
    numFixedPanes += 1;
  }

  if (ind.macd) {
    const macdLine = chart.addSeries(LC.LineSeries, { color: '#0A84FF', lineWidth: 1, priceLineVisible: false, lastValueVisible: false }, nextPane);
    macdLine.setData(ind.macd.macd || []);
    const signalLine = chart.addSeries(LC.LineSeries, { color: '#FF9F0A', lineWidth: 1, priceLineVisible: false, lastValueVisible: false }, nextPane);
    signalLine.setData(ind.macd.signal || []);
    const hist = chart.addSeries(LC.HistogramSeries, { priceLineVisible: false, lastValueVisible: false }, nextPane);
    hist.setData(ind.macd.histogram || []);
    registerSeries('macd_line', macdLine, ind.macd.macd);
    registerSeries('macd_signal', signalLine, ind.macd.signal);
    registerSeries('macd_hist', hist, ind.macd.histogram);
    nextPane += 1;
    numFixedPanes += 1;
  }

  // MA/Bollinger share the candles' own price scale ('left') so they
  // visually line up with price — a new line series on pane 0 defaults to
  // the 'right' scale, which this chart keeps hidden/unused (rightPriceScale
  // is disabled at setup), so it would render off-scale without this.
  //
  // Two explicit keys (ma20/ma50), not a single ma list — the MA+FVG
  // strategy (recommender.py) checks both periods independently, and
  // showing both on the SAME chart the strategy reads them from is the
  // whole point (see project preference: anything meant for a human to
  // see should be obvious, not inferred from a sidebar label alone).
  // Two distinct, high-contrast colors so which line is which reads at a
  // glance without a legend.
  // Generic ma_fast/ma_slow keys, not ma20/ma50 literals — the periods
  // are user-adjustable now, so the title reads whatever period Python
  // actually computed (ma_fast_period/ma_slow_period) instead of a
  // hardcoded number that could silently go stale.
  if (ind.ma_fast && ind.ma_fast.length) {
    const s = chart.addSeries(LC.LineSeries, {
      color: '#FFD60A', lineWidth: 2, priceScaleId: 'left', priceLineVisible: false, lastValueVisible: false,
      title: `EMA ${ind.ma_fast_period ?? ''}`,
    }, 0);
    s.setData(ind.ma_fast);
    registerSeries('ma_fast', s, ind.ma_fast);
  }
  if (ind.ma_slow && ind.ma_slow.length) {
    const s = chart.addSeries(LC.LineSeries, {
      color: '#64D2FF', lineWidth: 2, priceScaleId: 'left', priceLineVisible: false, lastValueVisible: false,
      title: `EMA ${ind.ma_slow_period ?? ''}`,
    }, 0);
    s.setData(ind.ma_slow);
    registerSeries('ma_slow', s, ind.ma_slow);
  }
  if (ind.bb) {
    const bbKeys = { upper: 'bb_upper', basis: 'bb_basis', lower: 'bb_lower' };
    Object.entries(bbKeys).forEach(([k, mapKey]) => {
      if (!ind.bb[k] || !ind.bb[k].length) return;
      const s = chart.addSeries(LC.LineSeries, {
        color: 'rgba(10,132,255,0.55)', lineWidth: 1, priceScaleId: 'left', priceLineVisible: false, lastValueVisible: false,
      }, 0);
      s.setData(ind.bb[k]);
      registerSeries(mapKey, s, ind.bb[k]);
    });
  }

  // Pane.setHeight() looked plausible but is genuinely broken for
  // multi-pane charts in this library version — confirmed directly
  // (measured 0-31.5px on a pane explicitly set to 140-300px, no matter how
  // long after creation it was called), and it's a known, filed issue
  // (tradingview/lightweight-charts#1847, #2035). The maintainer's own
  // fix in both threads: use setStretchFactor instead, and — critically —
  // use the desired PIXEL value directly AS the stretch factor for
  // "fixed-size" panes, with the main pane's factor computed as whatever
  // pixel height is left over. Stretch factors are relative weights, not
  // literal pixels, but feeding it pixel-shaped numbers this way is
  // exactly what makes the resulting ratio land on the right pixel split.
  // All panes must be set together or (per the same threads) the result is
  // "strange" — the loop below always covers every existing pane, not just
  // the ones just added.
  if (numFixedPanes > 0) {
    const FIXED_PANE_PX = 140;
    const totalPx = container.clientHeight || 700;
    const mainPx = Math.max(totalPx - FIXED_PANE_PX * numFixedPanes, 100);
    chart.panes().forEach((p, i) => {
      p.setStretchFactor(i === 0 ? mainPx : FIXED_PANE_PX);
    });
  }
}

function handleRender(args) {
  if (!args) return;
  const { bars, fingerprint, overlays, options, height, tick_labels, indicators, display_tz } = args;
  if (height) { lastFrameHeight = height; setFrameHeight(height); }
  setDisplayTz(display_tz);

  tickLabels = tick_labels || {};
  volumeSeries.applyOptions({ visible: !options || options.volume !== false });
  document.body.classList.toggle('chart-selected', !!(options && options.selected));
  // The mini HTF/LTF reference charts pass this — plain candles at a
  // glance, no O/H/L/C/source heading competing with the main chart's
  // own for space. See the .hide-ohlc rule below.
  document.body.classList.toggle('hide-ohlc', !!(options && options.hide_ohlc));
  candleWidthFactor = (options && options.candle_width_factor) || 1;
  alwaysFit = !!(options && options.always_fit);
  futureMarginFrac = (options && options.future_margin_frac) || 0;
  preserveLogicalRange = !!(options && options.preserve_logical_range);
  footprintEnabled = !!(options && options.footprint_enabled);
  // Idempotent and cheap (unlike the logical-range settling this file's
  // retry helpers exist for) — just applied straight through every render
  // when the caller passes it. Undefined leaves createChart's own default
  // (see rightOffset there) untouched, so every existing caller (the main
  // chart) keeps its already-tuned padding exactly as before.
  if (options && options.right_offset !== undefined) {
    chart.timeScale().applyOptions({ rightOffset: options.right_offset });
  }

  const noDataEl = document.getElementById('noDataOverlay');
  const errorMessage = options && options.error_message;
  noDataEl.style.display = errorMessage ? 'flex' : 'none';
  if (errorMessage) noDataEl.querySelector('span').textContent = errorMessage;

  const isFullReload = fingerprint !== lastFingerprint;
  lastFingerprint = fingerprint;
  // Resync detection: is Python's own "did I already send full data for
  // this fingerprint" belief actually true for THIS frontend instance?
  //
  // Tempting but WRONG first attempt (caught by testing, not left in):
  // comparing against isFullReload above. An iframe/component remount
  // resets ALL of this frontend's module state at once, INCLUDING
  // lastFingerprint back to null — so on the very next render after a
  // remount, isFullReload is ALREADY true (fingerprint !== null), same as
  // any genuine full reload. That's exactly why it's the wrong signal:
  // it can't distinguish "genuinely fresh data" from "fresh frontend,
  // stale data" — in BOTH cases isFullReload reads true, but only one of
  // them actually received the full bars array, because Python decides
  // that independently, server-side, from st.session_state — which
  // persists right through a remount that wipes this frontend's own
  // memory. Confirmed directly as a real failure mode this way: switching
  // timeframes left the candle series holding only the last history bar
  // plus the live bar (exactly bars[-2:], the incremental-tail payload,
  // silently standing in for the whole dataset) — with THIS frontend's
  // own isFullReload reading true the whole time, since it had no prior
  // fingerprint to compare against.
  //
  // The only way to actually catch the mismatch: have Python say what it
  // decided (args.ohlc.is_full_reload, opt-in — only the main chart's own
  // call site sets it; see app.py's _CHART_NEEDS_FULL_RELOAD comment) and
  // compare THAT against this frontend's own ground truth — barsByTime,
  // checked BEFORE this render's own merge below mutates it, so it
  // reflects whatever was actually cached walking in. Strict === false
  // (not falsy) so call sites that never opt in (mini panels, the
  // no-data path) — where args.ohlc.is_full_reload is simply undefined —
  // are correctly exempt rather than matching by accident.
  const pythonSaysFullReload = args.ohlc ? args.ohlc.is_full_reload : undefined;
  // Same exact class of mismatch as the bars check right below, just for
  // indicator series instead of candles: Python thinks this is a plain
  // incremental tick (indicators._full_reload === false) and sent only a
  // few trailing points, but THIS frontend instance's own indicatorSeriesMap
  // is empty — meaning it never actually received the full series to
  // begin with (a fresh mount/reconnect that happened to land in between
  // Python's own bookkeeping updates). Checked BEFORE applyIndicators
  // below (which would populate the map), same ordering reason as the
  // bars check. Only fires when there's actually indicator data to be
  // missing — an indicator-free chart has nothing to resync.
  const indHasData = !!(indicators && (indicators.ma_fast || indicators.ma_slow || indicators.rsi
    || indicators.atr || indicators.macd || indicators.bb));
  const indicatorsNeedResync = indicators && indicators._full_reload === false
    && Object.keys(indicatorSeriesMap).length === 0 && indHasData;
  const neededResyncBeforeThisRender = (pythonSaysFullReload === false && barsByTime.size === 0 && bars.length > 0)
    || indicatorsNeedResync;
  // What actually governs setData() vs. a last-bar-only patch below, and
  // whether barsByTime gets rebuilt vs. merged — NOT plain isFullReload.
  // Confirmed directly as a second bug on top of the first: the corrective
  // rerun app.py's own _CHART_NEEDS_FULL_RELOAD handling triggers DOES
  // arrive with the genuinely full bars array and is_full_reload:true —
  // but by then THIS frontend's own lastFingerprint already got set to the
  // current fingerprint on the FAILED render right before it (line above
  // runs unconditionally, every render), so isFullReload reads false for
  // the corrective render too, routing the full array through the
  // last-bar-only patch branch and discarding everything but the last
  // element anyway. Trusting Python's explicit is_full_reload whenever the
  // caller opted in (main chart only) sidesteps the frontend's own
  // fingerprint bookkeeping entirely for this decision; falls back to
  // isFullReload unchanged for every call site that never opts in (mini
  // panels, the no-data path), matching their existing behavior exactly.
  const effectiveFullReload = pythonSaysFullReload !== undefined ? pythonSaysFullReload : isFullReload;
  // A ticker/timeframe switch doesn't remount this iframe (same component
  // key across the switch — see the module docstring on "one instance
  // per call site"), so lastFootprintSentKey survives it untouched. Left
  // alone, a coincidental match — the new ticker's own default view
  // happening to round to the exact same visible-range seconds as the
  // old one, plausible since both simply show "the last ~120 bars up to
  // now" — would make the debounced listener believe nothing's changed
  // and never even ask Python to re-check, silently leaving the PREVIOUS
  // ticker's footprint cells (or lack thereof) showing over the new
  // ticker's candles indefinitely, until an actual pan/zoom happened to
  // produce a genuinely different key. Forcing a re-send on every real
  // full reload closes that gap; also proactively detaching the stale
  // primitive itself rather than leaving it attached hoping every one of
  // its candle times simply fails to resolve against the new series.
  window.__ictDebug._fpResetCount = (window.__ictDebug._fpResetCount || 0);
  if (effectiveFullReload) {
    window.__ictDebug._fpResetCount++;
    lastFootprintSentKey = null;
    if (activeFootprint) {
      candleSeries.detachPrimitive(activeFootprint);
      activeFootprint = null;
    }
  }

  // Synced on EVERY render now, not gated to full reloads — Python is the
  // single source of truth (a real checkbox, see app.py's "Log scale"),
  // and toggling that checkbox is itself just a normal rerun with the
  // SAME fingerprint (no new data, so isFullReload is false for it) —
  // gating this to full-reload-only would mean the checkbox visibly did
  // nothing until the next unrelated full reload happened to come along.
  isLogScale = !!(options && options.log_scale);
  applyScaleMode();

  // color/borderColor/wickColor are per-bar overrides (CandlestickSeries
  // supports these natively) — only ever set by Python for backfill
  // anchor bars (see _render_chart's backfill block), made fully
  // transparent so the bar still occupies a real, scrollable slot in the
  // series without being visible: the actual visible shape for that
  // stretch is drawn correctly-widthed by a ghost-candle primitive
  // instead, since a real series can't render one bar wider than another.
  const candleBars = bars.map((b) => {
    const c = { time: b.time, open: b.open, high: b.high, low: b.low, close: b.close };
    if (b.color !== undefined) { c.color = b.color; c.borderColor = b.borderColor; c.wickColor = b.wickColor; }
    return c;
  });
  const volBars = bars.map((b) => ({
    time: b.time, value: b.volume || 0,
    color: b.color !== undefined ? b.color : (b.close >= b.open ? 'rgba(48,209,88,0.5)' : 'rgba(255,69,58,0.5)'),
  }));

  // Captured BEFORE applyOverlays/applyIndicators below, not after —
  // confirmed directly this ordering is what was actually corrupting the
  // remembered view, not a timing/staleness quirk in the read itself.
  // applyIndicators rebuilds the indicator LINE series (EMA etc, always
  // re-set every render) with the NEW timeframe's data, while candleSeries
  // itself still holds the OLD timeframe's data until setData() runs a few
  // lines below — for that brief window, one series on the chart spans the
  // new timeframe's calendar range and another still spans the old one.
  // That mismatch was enough to make the library's own logical-range
  // machinery briefly report a bogus, far-too-wide range through
  // subscribeVisibleLogicalRangeChange (see that subscription's own
  // comment) — confirmed directly by timestamp, landing within a few
  // milliseconds of applyIndicators being called each time this reproduced.
  // Reading the prior view before either call touches any series' data
  // sidesteps the inconsistency instead of trying to filter it back out
  // afterward.
  let savedPriceRange = null;
  let savedTimeRange = null;
  let savedVisibleBarCount = null;
  if (effectiveFullReload) {
    // A ticker/TF switch used to always hand the price axis back to
    // autoscale, discarding any manual Y-zoom (drag/scroll on the price
    // axis) the user had set — setData() rebuilds the series, and the
    // default autoScale:true then just refits to whatever the NEW
    // timeframe's data happens to span. Capture the current manual range
    // (if the user actually zoomed the price axis away from autoscale —
    // priceScale().options().autoScale reports which mode it's in) BEFORE
    // the reload, and reapply it after, so switching timeframes keeps
    // whatever price band you were looking at instead of snapping back to
    // "fit everything." Only kicks in when the user genuinely zoomed the Y
    // axis by hand; ordinary autoscale behavior (the default) is untouched.
    const wasManualZoom = candleSeries.priceScale().options().autoScale === false;
    savedPriceRange = wasManualZoom ? candleSeries.priceScale().getVisibleRange() : null;

    // Same idea for the TIME axis, requested directly: preserve the exact
    // calendar window the user was looking at — left edge was this date,
    // right edge was that one — across the switch. Reads from
    // lastIntendedTimeRange (see its own comment for why that's not just
    // "whatever's rendered right now"), already in real calendar times —
    // no per-render conversion needed here, and no snapshot of the loaded
    // bars to keep in sync either.
    savedTimeRange = hasRenderedOnce ? lastIntendedTimeRange : null;

    // Bar count, kept only as a fallback for when the calendar window
    // itself doesn't survive the switch at all (predates the new
    // timeframe's own available history) — see the apply site below for
    // why that beats jumping straight to "fit everything." Derived from
    // what's actually on screen right now, not the wider intended window,
    // since this is specifically the case where honoring that intent
    // isn't possible.
    savedVisibleBarCount = (hasRenderedOnce && lastKnownLogicalRange &&
      lastKnownLogicalRange.to > lastKnownLogicalRange.from)
      ? Math.round(lastKnownLogicalRange.to - lastKnownLogicalRange.from)
      : null;
  }

  // preserveLogicalRange's own capture: the exact logical {from, to} on
  // screen RIGHT NOW, read synchronously (no debounce, no settle-tracking)
  // — valid to reapply as-is after setData() only because this caller's
  // own dataset never shifts bar 0, so index N still means the same bar
  // it did a moment ago. Read here, before setData() touches anything,
  // same reasoning as savedPriceRange/savedTimeRange above.
  const savedExactLogicalRange = (preserveLogicalRange && effectiveFullReload && hasRenderedOnce)
    ? chart.timeScale().getVisibleLogicalRange()
    : null;

  // Overlays/indicators are rebuilt every render, independent of
  // isFullReload — a layer checkbox toggling on/off, or the
  // mitigated/opacity settings changing, doesn't touch the underlying
  // dataset (fingerprint stays the same, correctly keeping the user's
  // pan/zoom), but the drawn overlays still need to reflect the new
  // selection every time. Detaching and reattaching a few dozen primitives
  // is cheap — this only runs once per Streamlit interaction, nowhere near
  // a per-frame cost.
  applyOverlays(overlays || {});
  applyIndicators(indicators || {});

  if (effectiveFullReload) {
    // Recomputed from THIS dataset's own last close, before setData — a
    // ticker/timeframe switch is exactly the moment the right precision
    // can change (leaving a forex chart for a crypto one, or vice versa).
    const lastClose = candleBars.length ? candleBars[candleBars.length - 1].close : null;
    currentPriceDecimals = computePriceDecimals(lastClose);
    candleSeries.applyOptions({
      priceFormat: { type: 'price', precision: currentPriceDecimals, minMove: Math.pow(10, -currentPriceDecimals) },
    });
    candleSeries.setData(candleBars);
    volumeSeries.setData(volBars);
    // Preferred: land on the exact same calendar window, converted to
    // this timeframe's own bar indices via a binary search — only when it
    // actually overlaps the NEW dataset's own span. Switching to a
    // timeframe whose history doesn't reach back that far (e.g. 1Y,
    // mostly-backfilled -> 1m, 7 real days) can't honor that at all, so it
    // falls through instead of silently showing an empty-looking chart
    // with the real data off past one edge.
    const newFirst = candleBars.length ? candleBars[0].time : null;
    const newLast = candleBars.length ? candleBars[candleBars.length - 1].time : null;
    const timeRangeStillValid = !alwaysFit && savedTimeRange && newFirst !== null &&
      savedTimeRange.to >= newFirst && savedTimeRange.from <= newLast;
    if (savedExactLogicalRange) {
      // The whole point of preserveLogicalRange: reapply the exact same
      // {from, to} that was on screen a moment ago, synchronously, right
      // now — no calendar conversion, no waiting for a settle event to
      // report back what actually landed. Correct specifically because
      // bar 0 never moves for this caller (see this option's own
      // declaration comment) — the indices captured above still point at
      // the same bars in the just-rebuilt series.
      chart.timeScale().setVisibleLogicalRange(savedExactLogicalRange);
      lastKnownLogicalRange = savedExactLogicalRange;
      adoptNextSettle = false;
    } else if (alwaysFit) {
      // Skip past the calendar-window/bar-count restore entirely — see
      // alwaysFit's own comment above. Always lands here on every full
      // reload (ticker/TF switch), not just first mount.
      fitContentWhenReady();
    } else if (timeRangeStillValid) {
      // Converting to LOGICAL indices into the NEW candleBars array first,
      // then calling setVisibleLogicalRange (a position-based API, not a
      // time-based one) — confirmed directly to land exactly on the
      // requested calendar window, unlike setVisibleRange(savedTimeRange)
      // (the obvious approach), which landed on a WRONG window, off by
      // months, even deferred a full task/animation-frame after setData().
      // The new dataset has a completely different bar density than the
      // old one (a real day is ~4x more bars on 1h than on 4h) —
      // whatever internal bar-spacing/zoom state carried over from the
      // OLD series appears to make setVisibleRange's own time-to-position
      // conversion land somewhere that "looks like" the old zoom level
      // rather than the literal requested timestamps.
      const findIndex = (targetTime) => {
        let lo = 0, hi = candleBars.length - 1;
        while (lo < hi) {
          const mid = (lo + hi) >> 1;
          if (candleBars[mid].time < targetTime) lo = mid + 1; else hi = mid;
        }
        return lo;
      };
      const fromIdx = findIndex(savedTimeRange.from);
      const toIdx = findIndex(savedTimeRange.to);
      // setLogicalRangeReliably, not a single setVisibleLogicalRange call —
      // a saved window that translates to a very different bar density in
      // the new timeframe (say, 1m to 1D) is exactly the kind of large
      // zoom-level jump that doesn't reliably land in one call (see that
      // function's own comment).
      setLogicalRangeReliably(fromIdx, toIdx, 3);
      // Set synchronously and optimistically — we already know exactly
      // what was just requested, no need to wait for the subscription to
      // confirm it back for THIS value specifically. lastIntendedTimeRange
      // is deliberately set to the ORIGINAL requested window here, not
      // whatever this actually renders as — if the library's own
      // rendering-width ceiling clamps it, the next switch to a timeframe
      // that CAN show the full window should still recover it, not
      // whatever fit this one time (see lastIntendedTimeRange's own
      // comment).
      lastKnownLogicalRange = { from: fromIdx, to: toIdx };
      lastIntendedTimeRange = savedTimeRange;
      // Cancels any pending "adopt the next settle" flag from before this
      // switch (a real user gesture on the OLD timeframe's chart, still
      // unconsumed) — this switch's own restore logic just decided
      // lastIntendedTimeRange directly, so a late settle tied to that
      // stale flag has nothing left to correctly attribute itself to.
      adoptNextSettle = false;
    } else if (savedVisibleBarCount && candleBars.length) {
      // Fallback: the exact calendar window is gone (predates this
      // timeframe's own history), so match candle COUNT instead, anchored
      // to the live edge — keeps roughly the same visual density instead
      // of jumping straight to "fit everything," which for a large
      // dataset can itself mean a near-empty-looking sliver (see
      // fitContentWhenReady's own comment on the library's real
      // rendering-width ceiling). No real calendar intent survives this
      // path, so lastIntendedTimeRange just adopts whatever this actually
      // shows, rather than carrying forward a window that was never
      // available here in the first place.
      // futureMarginFrac > 0: same margin fitContentWhenReady applies on
      // a fresh load, kept here too since THIS branch — not that one —
      // is what actually fires on an ordinary timeframe switch once any
      // zoom state has been saved (i.e. almost always, past the very
      // first render). Shifts the window rightward by that same
      // fraction of its own width rather than changing the zoom density
      // (savedVisibleBarCount) itself — the user's prior zoom level is
      // still honored, just re-centered to leave room on the right.
      const lastRealIdx = candleBars.length - 1;
      const newTo = futureMarginFrac > 0
        ? lastRealIdx + savedVisibleBarCount * futureMarginFrac
        : lastRealIdx;
      const newFrom = Math.max(0, newTo - savedVisibleBarCount);
      setLogicalRangeReliably(newFrom, newTo, 3);
      lastKnownLogicalRange = { from: newFrom, to: newTo };
      lastIntendedTimeRange = { from: candleBars[newFrom].time, to: candleBars[Math.min(lastRealIdx, Math.round(newTo))].time };
      adoptNextSettle = false;
    } else {
      // No saved state to restore at all (genuinely first load). Left to
      // settle and register itself as the new intended range through the
      // ordinary subscription path above — fitContentWhenReady is its own
      // multi-step async process (double rAF, then its own retries), so
      // there's no single synchronous result here worth recording early.
      fitContentWhenReady();
    }
    hasRenderedOnce = true;
    // A full reload replaces the whole series, so the gate must forget
    // whatever it last saw — otherwise a reload to an earlier time range
    // (new ticker/TF) would have every subsequent update rejected as "old".
    lastSeriesTime = candleBars.length ? candleBars[candleBars.length - 1].time : null;

    if (savedPriceRange) {
      candleSeries.priceScale().applyOptions({ autoScale: false });
      candleSeries.priceScale().setVisibleRange(savedPriceRange);
    }
  } else if (candleBars.length) {
    // Same dataset, newer/changed last bar only — routed through the same
    // gate the WS feed uses, so whichever source (this poll or a faster WS
    // push) is actually ahead wins instead of either one crashing the chart.
    safeSeriesUpdate(candleBars[candleBars.length - 1], volBars[volBars.length - 1]);
  }

  // In-chart OHLC readout, TradingView-style — reflects the latest bar by
  // default, and whatever candle the crosshair is over while hovering (see
  // the subscribeCrosshairMove handler above renderOhlc's definition).
  //
  // Python only sends the full `bars` array on a genuine full reload — on
  // every other (steady-state, every-few-seconds) tick it sends just the
  // tail, to avoid re-serializing and re-transmitting thousands of rows
  // when only the last one or two actually changed. So barsByTime gets
  // rebuilt wholesale on a full reload, and merged (upsert by time) on an
  // incremental one — losing the merge here would silently break hovering
  // over any candle except the very last few after the first tick.
  if (effectiveFullReload) {
    barsByTime = new Map(bars.map((b) => [b.time, b]));
  } else {
    bars.forEach((b) => barsByTime.set(b.time, b));
  }
  currentOhlcMeta = args.ohlc || {};
  formingBarTime = currentOhlcMeta.forming_bar_time ?? null;
  lastBar = bars.length ? bars[bars.length - 1] : lastBar;
  renderOhlc(lastBar, false);
  // Cheap to call every render — connectLiveFeed no-ops immediately if
  // already on the right symbol+interval, which is true on nearly every
  // call (only a genuine ticker/TF switch, or the no-data path sending no
  // symbol at all, actually opens/closes a connection).
  connectLiveFeed(currentOhlcMeta.symbol, currentOhlcMeta.interval);

  // Normally null (see _select_chart's own docstring on the click-value
  // contract this shares) — the one exception is the resync signal
  // computed above: a real, distinct string value Python checks for
  // BEFORE treating this as a click, so it can clear its own
  // "already sent this fingerprint" bookkeeping and re-render with the
  // full array this frontend instance is actually missing.
  sendToStreamlit('streamlit:setComponentValue', {
    value: neededResyncBeforeThisRender ? '__ICT_CHART_NEEDS_FULL_RELOAD__' : null,
    dataType: 'json',
  });
}

sendToStreamlit('streamlit:componentReady', { apiVersion: 1 });
// No speculative setFrameHeight(N) here on purpose. This same template
// serves 3 differently-sized instances (main=1000, mini=380x2) — any single
// guessed number is wrong for at least two of them, and the correction
// once real args arrive (handleRender's own setFrameHeight(args.height))
// is exactly the visible page-layout jump this is fixing. Streamlit's
// first real streamlit:render call lands within the same tick as
// componentReady in practice, so there's nothing meaningful to show a
// guessed height for in the gap anyway.

Object.assign(window.__ictDebug, {
  chart, candleSeries, volumeSeries,
  getLastArgs: () => onRenderArgs,
  getLastFingerprint: () => lastFingerprint,
  getMeasureState: () => ({
    mode: measureMode, pendingA: measureA,
    lines: measurePrimitives.map((p) => ({ p1: p.p1, p2: p.p2, label: p.label })),
  }),
  getViewState: () => ({ futureMarginFrac, hasRenderedOnce, lastKnownLogicalRange, lastIntendedTimeRange }),
  getFootprintState: () => ({
    footprintEnabled, lastFootprintSentKey,
    barSpacing: chart.timeScale().options().barSpacing,
    minBarSpacing: FOOTPRINT_MIN_BAR_SPACING,
    hasActivePrimitive: !!activeFootprint,
    fpResetCount: window.__ictDebug._fpResetCount || 0,
  }),
});
</script>
</body></html>
